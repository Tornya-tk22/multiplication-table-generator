
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Multiplication Generator</title>

  <style>

    /* ===== GLOBAL STYLES ===== */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 20px;

      font-family: 'Segoe UI', sans-serif;

      background: #111827;
      color: #f1f5f9;
    }


    /* ===== MAIN CONTAINER ===== */

    .main-container {
      width: 100%;
      max-width: 430px;

      text-align: center;
    }

    .main-container h1 {
      font-size: 26px;
      font-weight: 650;

      margin-bottom: 8px;
    }

    .subtitle {
      color: #9ca3af;
      font-size: 14px;

      margin-bottom: 25px;
    }


    /* ===== MAIN CARD ===== */

    .table-container {
      padding: 28px 24px;

      background: #1f2937;

      border: 1px solid #374151;
      border-radius: 14px;
    }

    .table-container h2 {
      font-size: 20px;
      color: #61d6a5;

      margin-bottom: 8px;
    }

    .description {
      color: #9ca3af;
      font-size: 13px;

      margin-bottom: 23px;
      line-height: 1.5;
    }


    /* ===== INPUT SECTION ===== */

    .info-container {
      display: flex;
      flex-direction: column;
      gap: 13px;
    }

    input {
      width: 100%;
      height: 50px;

      padding: 0 15px;

      border: 1px solid #4b5563;
      border-radius: 8px;

      background: #111827;
      color: white;

      font-size: 15px;
      text-align: center;

      outline: none;

      transition: 0.2s ease;
    }

    input:focus {
      border-color: #61d6a5;
    }

    input::placeholder {
      color: #6b7280;
    }


    /* ===== BUTTON ===== */

    button {
      width: 100%;

      padding: 13px;

      border: none;
      border-radius: 8px;

      background: #16a879;
      color: white;

      font-size: 14px;
      font-weight: 600;

      cursor: pointer;

      transition: 0.2s ease;
    }

    button:hover {
      background: #128c65;
    }

    button:active {
      transform: scale(0.98);
    }


    /* ===== RESULTS ===== */

    .result-container {
      margin-top: 22px;

      max-height: 330px;
      overflow-y: auto;
    }

    #result {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    #result p {
      padding: 11px;

      background: #273449;

      border: 1px solid #374151;
      border-radius: 7px;

      color: #e5e7eb;
      font-size: 14px;

      animation: fadeIn 0.25s ease forwards;
    }

    #result p:hover {
      background: #304158;
    }

    .error {
      color: #ff8585 !important;
    }


    /* ===== FOOTER ===== */

    .footer {
      margin-top: 23px;

      color: #6b7280;
      font-size: 11px;

      letter-spacing: 1px;
    }


    /* ===== ANIMATION ===== */

    @keyframes fadeIn {

      from {
        opacity: 0;
        transform: translateY(5px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }

    }


    /* ===== RESPONSIVE DESIGN ===== */

    @media (max-width: 480px) {

      .main-container h1 {
        font-size: 23px;
      }

      .table-container {
        padding: 24px 18px;
      }

    }

  </style>

</head>


<body>

  <main class="main-container">

    <h1>JavaScript Learning</h1>

    <p class="subtitle">
      Practice your mathematics with JavaScript.
    </p>


    <section class="table-container">

      <h2>Multiplication ×12</h2>

      <p class="description">
        Enter a number to generate its multiplication table.
      </p>


      <div class="info-container">

        <input
          type="number"
          id="num"
          placeholder="Enter a number"
        >

        <button onclick="generateTable()">
          Generate Table →
        </button>

      </div>


      <div class="result-container">

        <div id="result" aria-live="polite"></div>

      </div>

    </section>


    <footer class="footer">
      BUILT WITH JAVASCRIPT · @FASAA
    </footer>

  </main>


  <script>

    function generateTable() {

      let num = document.getElementById("num").value;
      let result = document.getElementById("result");

      result.innerHTML = "";

      if (num.trim() === "" || !Number.isFinite(Number(num))) {

        result.innerHTML =
          '<p class="error">Please enter a valid number!</p>';

        return;
      }

      for (let i = 1; i <= 12; i++) {

        let results = `${num} × ${i} = ${Number(num) * i}`;

        let p = document.createElement("p");

        p.textContent = results;

        result.appendChild(p);

      }

    }

    document.getElementById("num").addEventListener("keypress", function(e) {

      if (e.key === "Enter") {
        generateTable();
      }

    });

  </script>

</body>

</html>
