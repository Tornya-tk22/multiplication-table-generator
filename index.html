
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Multiplication Generator | FASAA</title>

  <style>

    /* ===== CSS VARIABLES ===== */

    :root {
      --background: #0b1020;
      --surface: #141c2e;
      --surface-light: #1b263b;

      --primary: #4f46e5;
      --primary-hover: #4338ca;

      --accent: #61d6a5;

      --text: #f1f5f9;
      --text-muted: #94a3b8;

      --border: rgba(255, 255, 255, 0.09);

      --radius: 14px;
      --transition: 0.3s ease;
    }


    /* ===== RESET ===== */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    /* ===== BODY ===== */

    body {
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 25px;

      font-family: 'Segoe UI', sans-serif;

      background:
        radial-gradient(
          circle at 10% 10%,
          rgba(79, 70, 229, 0.16),
          transparent 35%
        ),
        var(--background);

      color: var(--text);
    }


    /* ===== MAIN LAYOUT ===== */

    .main-container {
      width: 100%;
      max-width: 480px;
    }


    /* ===== HEADER ===== */

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .header .tag {
      display: inline-block;

      padding: 7px 13px;
      margin-bottom: 15px;

      border: 1px solid rgba(97, 214, 165, 0.2);
      border-radius: 30px;

      background: rgba(97, 214, 165, 0.08);

      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
    }

    .header h1 {
      font-size: 30px;
      font-weight: 750;
      letter-spacing: -1px;
      margin-bottom: 10px;
    }

    .header p {
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1.6;
    }


    /* ===== MAIN CARD ===== */

    .table-container {
      padding: 30px;

      background: var(--surface);

      border: 1px solid var(--border);
      border-radius: 18px;

      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }


    /* ===== CARD HEADING ===== */

    .card-heading {
      margin-bottom: 25px;
    }

    .card-heading h2 {
      font-size: 21px;
      margin-bottom: 8px;
    }

    .card-heading h2 span {
      color: var(--accent);
    }

    .card-heading p {
      color: var(--text-muted);
      font-size: 13px;
      line-height: 1.6;
    }


    /* ===== INPUT SECTION ===== */

    .info-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .info-container label {
      color: #cbd5e1;
      font-size: 13px;
      font-weight: 600;
    }

    input {
      width: 100%;
      height: 54px;

      padding: 0 16px;

      border: 1px solid #303b50;
      border-radius: var(--radius);

      background: #0e1627;

      color: var(--text);
      font-size: 16px;

      outline: none;

      transition: var(--transition);
    }

    input:focus {
      border-color: var(--primary);

      box-shadow:
        0 0 0 3px rgba(79, 70, 229, 0.16);
    }

    input::placeholder {
      color: #64748b;
    }


    /* ===== BUTTON ===== */

    button {
      width: 100%;

      padding: 15px;

      border: none;
      border-radius: var(--radius);

      background: var(--primary);

      color: white;
      font-size: 15px;
      font-weight: 650;

      cursor: pointer;

      transition: var(--transition);
    }

    button:hover {
      background: var(--primary-hover);

      transform: translateY(-2px);

      box-shadow:
        0 8px 20px rgba(79, 70, 229, 0.25);
    }

    button:active {
      transform: scale(0.98);
    }


    /* ===== RESULTS SECTION ===== */

    .result-container {
      margin-top: 28px;

      max-height: 350px;
      overflow-y: auto;
    }

    #result {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    #result p {
      padding: 13px 15px;

      background: var(--surface-light);

      border: 1px solid var(--border);
      border-radius: 10px;

      color: #e2e8f0;

      font-size: 15px;
      font-weight: 500;

      transition: var(--transition);

      animation: fadeIn 0.3s ease forwards;
    }

    #result p:hover {
      background: rgba(79, 70, 229, 0.12);

      border-color: rgba(79, 70, 229, 0.4);

      transform: translateX(3px);
    }

    .error {
      color: #ff8585 !important;

      border-color: rgba(255, 100, 100, 0.2) !important;
      background: rgba(255, 100, 100, 0.08) !important;
    }


    /* ===== FOOTER ===== */

    .footer {
      margin-top: 25px;

      text-align: center;

      color: #64748b;

      font-size: 11px;
      letter-spacing: 1.5px;
    }


    /* ===== ANIMATION ===== */

    @keyframes fadeIn {

      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }

    }


    /* ===== RESPONSIVE DESIGN ===== */

    @media (max-width: 480px) {

      body {
        padding: 18px;
      }

      .header h1 {
        font-size: 25px;
      }

      .table-container {
        padding: 24px 19px;
      }

    }

  </style>

</head>


<body>

  <main class="main-container">


    <!-- HEADER -->

    <header class="header">

      <span class="tag">
        JAVASCRIPT PROJECT
      </span>

      <h1>JavaScript Learning</h1>

      <p>
        Building logic through practical mathematics.
        Learn, practice, and improve.
      </p>

    </header>


    <!-- MAIN CARD -->

    <section class="table-container">


      <!-- CARD HEADING -->

      <div class="card-heading">

        <h2>
          Multiplication <span>×12</span>
        </h2>

        <p>
          Enter any number below to generate
          its multiplication table.
        </p>

      </div>


      <!-- INPUT SECTION -->

      <div class="info-container">

        <label for="num">
          Enter your number
        </label>

        <input
          type="number"
          id="num"
          placeholder="e.g. 5"
          step="any"
        >

        <button onclick="generateTable()">
          Generate Table →
        </button>

      </div>


      <!-- RESULTS -->

      <div class="result-container">

        <div
          id="result"
          aria-live="polite"
        ></div>

      </div>


    </section>


    <!-- FOOTER -->

    <footer class="footer">

      BUILT WITH HTML · CSS · JAVASCRIPT

      <br><br>

      © 2026 FASAA

    </footer>


  </main>


  <!-- JAVASCRIPT -->

  <script>

    function generateTable() {

      let num = document.getElementById("num").value;
      let result = document.getElementById("result");

      result.innerHTML = "";

      if (num.trim() === "" || !Number.isFinite(Number(num))) {

        result.innerHTML =
          '<p class="error">Please enter a valid number!</p>';

        return;
      }

      for (let i = 1; i <= 12; i++) {

        let results = `${num} × ${i} = ${Number(num) * i}`;

        let p = document.createElement("p");

        p.textContent = results;

        result.appendChild(p);

      }

    }

    document.getElementById("num").addEventListener("keypress", function(e) {

      if (e.key === "Enter") {
        generateTable();
      }

    });

  </script>


</body>
</html>
