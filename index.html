
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multiplication Generator</title>

  <style>
    /* ===== GLOBAL STYLES ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      font-family: 'Segoe UI', sans-serif;
      background:
        radial-gradient(circle at top left, #202d40, transparent 45%),
        linear-gradient(135deg, #0f1117, #171c27);
      color: #fff;
    }

    /* ===== MAIN CONTAINER ===== */
    .main-container {
      width: 100%;
      max-width: 430px;
      text-align: center;
    }

    .main-container h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -1px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #9299a8;
      font-size: 14px;
      margin-bottom: 30px;
    }

    /* ===== GLASS CARD ===== */
    .table-container {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 18px;
      padding: 30px 25px;
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.3);
    }

    .table-container h2 {
      font-size: 20px;
      color: #61d6a5;
      margin-bottom: 8px;
    }

    .description {
      color: #9da5b4;
      font-size: 13px;
      margin-bottom: 25px;
    }

    /* ===== INPUT SECTION ===== */
    .info-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    input {
      width: 100%;
      height: 52px;
      padding: 0 15px;
      border-radius: 10px;
      border: 1px solid #343d4c;
      background: rgba(0, 0, 0, 0.25);
      color: white;
      font-size: 16px;
      text-align: center;
      outline: none;
      transition: 0.3s ease;
    }

    input:focus {
      border-color: #61d6a5;
      box-shadow: 0 0 0 3px rgba(97, 214, 165, 0.12);
    }

    input::placeholder {
      color: #737d8d;
    }

    /* ===== BUTTON ===== */
    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #24b982, #13a16c);
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 7px 20px rgba(36, 185, 130, 0.25);
    }

    button:active {
      transform: scale(0.98);
    }

    /* ===== RESULTS ===== */
    .result-container {
      margin-top: 25px;
      max-height: 350px;
      overflow-y: auto;
    }

    #result {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    #result p {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 8px;
      padding: 11px;
      color: #e5eaf1;
      font-size: 15px;
      transition: 0.2s ease;
      animation: fadeIn 0.3s ease forwards;
    }

    #result p:hover {
      background: rgba(97, 214, 165, 0.12);
      border-color: rgba(97, 214, 165, 0.3);
    }

    .error {
      color: #ff8585;
      font-size: 14px;
      padding: 10px;
    }

    /* ===== FOOTER ===== */
    .footer {
      margin-top: 25px;
      color: #737d8d;
      font-size: 12px;
      letter-spacing: 1px;
    }

    /* ===== ANIMATION ===== */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ===== RESPONSIVE DESIGN ===== */
    @media (max-width: 480px) {
      .main-container h1 {
        font-size: 24px;
      }

      .table-container {
        padding: 25px 18px;
      }
    }

  </style>
</head>

<body>

  <main class="main-container">

    <h1>JavaScript Learning</h1>
    <p class="subtitle">Practice your mathematics with JavaScript.</p>

    <section class="table-container">

      <h2>Multiplication ×12</h2>

      <p class="description">
        Enter a number to generate its multiplication table.
      </p>

      <div class="info-container">

        <input
          type="number"
          id="num"
          placeholder="Enter a number"
        >

        <button onclick="generateTable()">
          Generate Table →
        </button>

      </div>

      <div class="result-container">
        <div id="result" aria-live="polite"></div>
      </div>

    </section>

    <footer class="footer">
      BUILT WITH JAVASCRIPT · @FASAA
    </footer>

  </main>

  <script>

    function generateTable() {

      let num = document.getElementById("num").value;
      let result = document.getElementById("result");

      result.innerHTML = "";

      if (num.trim() === "" || !Number.isFinite(Number(num))) {

        result.innerHTML =
          '<p class="error">Please enter a valid number!</p>';

        return;
      }

      for (let i = 1; i <= 12; i++) {

        let results = `${num} × ${i} = ${Number(num) * i}`;

        let p = document.createElement("p");

        p.textContent = results;

        result.appendChild(p);

      }

    }

    document.getElementById("num").addEventListener("keypress", function(e) {

      if (e.key === "Enter") {
        generateTable();
      }

    });

  </script>

</body>
</html>
